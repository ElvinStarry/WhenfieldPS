name: Stable

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '?'
        required: true
        default: '狮鹫前线'
      windows:
        description: 'W'
        required: true
        type: boolean
        default: true
      ubuntu:
        description: 'L'
        required: true
        type: boolean
        default: true

jobs:
  build-windows:
    if: ${{ inputs.windows == true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish with NativeAOT
        run: dotnet publish Campofinale/Campofinale.csproj --configuration Release -p:PublishAot=true -p:SelfContained=true --runtime win-x64
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Campofinale-${{ inputs.branch }}-Windows
          path: Campofinale/bin/Release/net9.0/win-x64/publish

  build-ubuntu:
    if: ${{ inputs.ubuntu == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Publish with NativeAOT
        run: dotnet publish Campofinale/Campofinale.csproj --configuration Release -p:PublishAot=true -p:SelfContained=true --runtime linux-x64
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Campofinale-${{ inputs.branch }}-Linux
          path: Campofinale/bin/Release/net9.0/linux-x64/publish
